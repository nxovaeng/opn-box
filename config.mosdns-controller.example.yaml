# ==============================================================================
# MosDNS Controller 自研控制端默认配置文件样例
# 安装位置建议: /usr/local/etc/mosdns/controller.yaml (或 controller_settings.json)
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. 分流运行模式 (Routing Mode)
# ------------------------------------------------------------------------------
# 可选值:
# - whitelist: 白名单直连模式 (推荐)。明确国内域名走国内直连，其余所有出海与未知域名走代理并入 PF 表。
# - blacklist: 黑名单代理模式。明确 GFW 出海名单走代理并入 PF 表，其余域名全部走国内直连。
# - custom:    自定义混合模式。直连列表直连，代理列表代理，未明确分类域名根据 custom_default_route 决定走向。
mode: "whitelist"

# 混合模式 (custom) 下未命中任何规则库的未知/未明确分类域名的默认兜底走向
# 可选值: "proxy" (走代理并入表) 或 "direct" (走国内直连)
custom_default_route: "proxy"

# ------------------------------------------------------------------------------
# 2. 上下游 DNS 解析器配置 (DNS Forwarders)
# ------------------------------------------------------------------------------
# 国内直连上游 DNS 服务器列表 (UDP / TCP)
local_dns:
  - "223.5.5.5"
  - "119.29.29.29"

# 海外出海上游 DNS 服务器列表
# ------------------------------------------------------------------------------
# 模式 A (推荐: Xray 内置 DNS 服务直连):
#   直接指向 Xray 的 dokodemo-door 入站 (127.0.0.1:10853)。
#   由 Xray 内部接管出海解析并通过激活节点代理查询，天然零死锁。
#
# 模式 B (备选: 经由本地 SOCKS5 代理向远端公共 DNS 发起 TCP 查询):
#   配置为 "tcp://1.1.1.1:53" 或 "tcp://8.8.8.8:53"，
#   并配置下方的 remote_socks5: "127.0.0.1:10808"。
# ------------------------------------------------------------------------------
remote_dns:
  - "127.0.0.1:10853"
  # - "tcp://1.1.1.1:53"
  # - "tcp://8.8.8.8:53"

# 远端 DNS SOCKS5 代理通道
# 说明:
# 1. 当 remote_dns 指向本地 "127.0.0.1:10853" 时，走本地回环直连，此项留空即可 ("")；
# 2. 当 remote_dns 配置为远端公共 DNS (如 tcp://1.1.1.1:53) 时，设置为 "127.0.0.1:10808"，
#    通过本地回环 SOCKS5 隧道完成远端握手，同样完全不经过 TUN 虚拟网卡。
remote_socks5: ""

# ------------------------------------------------------------------------------
# 3. 本地监听与 FreeBSD /dev/pf 内核零竞态同步参数
# ------------------------------------------------------------------------------
# MosDNS 本地监听地址与端口 (同时监听 UDP 与 TCP)
listen_addr: "127.0.0.1:5353"

# FreeBSD PF 动态外部别名表名 (需在 OPNsense Firewall -> Aliases 中创建 External 类型别名)
pf_table: "GFW_Proxy"

# 动态入表条目最小 TTL 钳位 (秒，防止 TTL 过小导致频繁刷新)
min_ttl: 60

# 动态入表条目最大 TTL 钳位 (秒，防止条目堆积打满防火墙内存)
max_ttl: 86400

# pf-aliasd 守护进程 Unix Domain Socket 通信路径
pf_socket: "/var/run/pf-aliasd.sock"

# 是否启用自定义阻止名单拦截 (custom-block.txt 广告或恶意域名阻断)
block_enabled: true

# 远程上游查询并发数
concurrent: 2

# MosDNS 日志级别 (debug, info, warn, error)
log_level: "info"
