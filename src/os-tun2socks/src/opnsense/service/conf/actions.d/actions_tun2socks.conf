# ==============================================================================
# actions_tun2socks.conf - Tun2Socks (hev-socks5-tunnel & Controller) 服务动作定义
# 作用域: configctl tun2socks <action>
# 职责边界: 专注 tun0 虚拟网卡状态维护、纯 C 协程 SOCKS5 桥接与 hev-controller WebUI
# ==============================================================================

# --- 联合服务启停 ---
[start]
command:/usr/local/etc/rc.d/hev_socks5_tunnel start && /usr/local/etc/rc.d/hev_controller start
parameters:
type:script
message:starting hev-socks5-tunnel and controller

[stop]
command:/usr/local/etc/rc.d/hev_controller stop ; /usr/local/etc/rc.d/hev_socks5_tunnel stop
parameters:
type:script
message:stopping hev-socks5-tunnel and controller

[restart]
command:/usr/local/etc/rc.d/hev_controller restart ; /usr/local/etc/rc.d/hev_socks5_tunnel restart
parameters:
type:script
message:restarting hev-socks5-tunnel and controller

[status]
command:/usr/local/etc/rc.d/hev_socks5_tunnel status && /usr/local/etc/rc.d/hev_controller status
parameters:
type:script_output
message:checking hev-socks5-tunnel and controller status

# --- 子服务独立控制: hev-socks5-tunnel (TUN2SOCKS 协程桥接引擎) ---
[tunnel.start]
command:/usr/local/etc/rc.d/hev_socks5_tunnel start
parameters:
type:script
message:starting hev-socks5-tunnel

[tunnel.stop]
command:/usr/local/etc/rc.d/hev_socks5_tunnel stop
parameters:
type:script
message:stopping hev-socks5-tunnel

[tunnel.restart]
command:/usr/local/etc/rc.d/hev_socks5_tunnel restart
parameters:
type:script
message:restarting hev-socks5-tunnel

[tunnel.status]
command:/usr/local/etc/rc.d/hev_socks5_tunnel status
parameters:
type:script_output
message:checking hev-socks5-tunnel status

# --- 子服务独立控制: hev-controller (Tun2Socks Web 管理面板 :5382) ---
[controller.start]
command:/usr/local/etc/rc.d/hev_controller start
parameters:
type:script
message:starting hev-controller

[controller.stop]
command:/usr/local/etc/rc.d/hev_controller stop
parameters:
type:script
message:stopping hev-controller

[controller.restart]
command:/usr/local/etc/rc.d/hev_controller restart
parameters:
type:script
message:restarting hev-controller

[controller.status]
command:/usr/local/etc/rc.d/hev_controller status
parameters:
type:script_output
message:checking hev-controller status
