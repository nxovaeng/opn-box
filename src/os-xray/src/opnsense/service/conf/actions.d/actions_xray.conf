# ==============================================================================
# actions_xray.conf - Xray-core & Xray Manager 服务动作定义
# 作用域: configctl xray <action>
# 职责边界: 专注 Xray 7层应用特征分流引擎、SNI 嗅探、节点订阅与 xray-controller WebUI
# ==============================================================================

# --- 联合服务启停 ---
[start]
command:/usr/local/etc/rc.d/xray start && /usr/local/etc/rc.d/xray_controller start
parameters:
type:script
message:starting xray-core and xray-controller

[stop]
command:/usr/local/etc/rc.d/xray_controller stop ; /usr/local/etc/rc.d/xray stop
parameters:
type:script
message:stopping xray-core and xray-controller

[restart]
command:/usr/local/etc/rc.d/xray_controller restart ; /usr/local/etc/rc.d/xray restart
parameters:
type:script
message:restarting xray-core and xray-controller

[status]
command:/usr/local/etc/rc.d/xray status && /usr/local/etc/rc.d/xray_controller status
parameters:
type:script_output
message:checking xray-core and xray-controller status

# --- 子服务独立控制: Xray 核心代理引擎 ---
[core.start]
command:/usr/local/etc/rc.d/xray start
parameters:
type:script
message:starting xray-core

[core.stop]
command:/usr/local/etc/rc.d/xray stop
parameters:
type:script
message:stopping xray-core

[core.restart]
command:/usr/local/etc/rc.d/xray restart
parameters:
type:script
message:restarting xray-core

[core.status]
command:/usr/local/etc/rc.d/xray status
parameters:
type:script_output
message:checking xray-core status

# --- 子服务独立控制: Xray Controller Web 管理面板 (:5384) ---
[controller.start]
command:/usr/local/etc/rc.d/xray_controller start
parameters:
type:script
message:starting xray-controller

[controller.stop]
command:/usr/local/etc/rc.d/xray_controller stop
parameters:
type:script
message:stopping xray-controller

[controller.restart]
command:/usr/local/etc/rc.d/xray_controller restart
parameters:
type:script
message:restarting xray-controller

[controller.status]
command:/usr/local/etc/rc.d/xray_controller status
parameters:
type:script_output
message:checking xray-controller status
