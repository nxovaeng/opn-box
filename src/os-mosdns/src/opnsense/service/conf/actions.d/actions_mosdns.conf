# ==============================================================================
# actions_mosdns.conf - MosDNS, pf-aliasd & Controller 服务动作定义
# 作用域: configctl mosdns <action>
# 职责边界: 专注 DNS 动态解析、/dev/pf 内核零首包同步守护与 MosDNS Controller WebUI
# ==============================================================================

# --- 联合服务启停 ---
[start]
command:/usr/local/etc/rc.d/pf_aliasd start && /usr/local/etc/rc.d/mosdns start && /usr/local/etc/rc.d/mosdns_controller start
parameters:
type:script
message:starting MosDNS, pf-aliasd and controller services

[stop]
command:/usr/local/etc/rc.d/mosdns_controller stop ; /usr/local/etc/rc.d/mosdns stop ; /usr/local/etc/rc.d/pf_aliasd stop
parameters:
type:script
message:stopping MosDNS, pf-aliasd and controller services

[restart]
command:/usr/local/etc/rc.d/mosdns_controller restart ; /usr/local/etc/rc.d/mosdns restart ; /usr/local/etc/rc.d/pf_aliasd restart
parameters:
type:script
message:restarting MosDNS, pf-aliasd and controller services

[status]
command:/usr/local/etc/rc.d/pf_aliasd status && /usr/local/etc/rc.d/mosdns status && /usr/local/etc/rc.d/mosdns_controller status
parameters:
type:script_output
message:checking MosDNS, pf-aliasd and controller status

# --- 子服务独立控制: MosDNS 核心转发引擎 ---
[dns.start]
command:/usr/local/etc/rc.d/mosdns start
parameters:
type:script
message:starting MosDNS daemon

[dns.stop]
command:/usr/local/etc/rc.d/mosdns stop
parameters:
type:script
message:stopping MosDNS daemon

[dns.restart]
command:/usr/local/etc/rc.d/mosdns restart
parameters:
type:script
message:restarting MosDNS daemon

[dns.status]
command:/usr/local/etc/rc.d/mosdns status
parameters:
type:script_output
message:checking MosDNS status

# --- 子服务独立控制: pf-aliasd (零首包竞态 PF 表守护进程) ---
[pf_aliasd.start]
command:/usr/local/etc/rc.d/pf_aliasd start
parameters:
type:script
message:starting pf-aliasd daemon

[pf_aliasd.stop]
command:/usr/local/etc/rc.d/pf_aliasd stop
parameters:
type:script
message:stopping pf-aliasd daemon

[pf_aliasd.restart]
command:/usr/local/etc/rc.d/pf_aliasd restart
parameters:
type:script
message:restarting pf-aliasd daemon

[pf_aliasd.status]
command:/usr/local/etc/rc.d/pf_aliasd status
parameters:
type:script_output
message:checking pf-aliasd status

# --- 子服务独立控制: MosDNS Controller Web 管理面板 (:5380) ---
[controller.start]
command:/usr/local/etc/rc.d/mosdns_controller start
parameters:
type:script
message:starting MosDNS controller

[controller.stop]
command:/usr/local/etc/rc.d/mosdns_controller stop
parameters:
type:script
message:stopping MosDNS controller

[controller.restart]
command:/usr/local/etc/rc.d/mosdns_controller restart
parameters:
type:script
message:restarting MosDNS controller

[controller.status]
command:/usr/local/etc/rc.d/mosdns_controller status
parameters:
type:script_output
message:checking MosDNS controller status
