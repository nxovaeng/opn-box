[start]
command:/usr/local/etc/rc.d/mosdns start && /usr/local/etc/rc.d/pf_aliasd start
parameters:
type:script
message:starting MosDNS and pf-aliasd services

[stop]
command:/usr/local/etc/rc.d/mosdns stop && /usr/local/etc/rc.d/pf_aliasd stop
parameters:
type:script
message:stopping MosDNS and pf-aliasd services

[restart]
command:/usr/local/etc/rc.d/mosdns restart && /usr/local/etc/rc.d/pf_aliasd restart
parameters:
type:script
message:restarting MosDNS and pf-aliasd services

[status]
command:/usr/local/etc/rc.d/mosdns status && /usr/local/etc/rc.d/pf_aliasd status
parameters:
type:script_output
message:checking MosDNS and pf-aliasd status
