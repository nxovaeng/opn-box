# ==============================================================================
# actions_mosdns.conf - MosDNS, pf-aliasd & Controller 服务动作定义
# 作用域: configctl mosdns <action>
# 职责边界: 专注 DNS 动态解析、/dev/pf 内核零首包同步守护与 MosDNS Controller WebUI
# ==============================================================================

# --- 联合服务启停 ---
[start]
command:/usr/local/sbin/mosdns-control start
parameters:
type:script_output
message:starting MosDNS, pf-aliasd and controller services

[stop]
command:/usr/local/sbin/mosdns-control stop
parameters:
type:script_output
message:stopping MosDNS, pf-aliasd and controller services

[restart]
command:/usr/local/sbin/mosdns-control restart
parameters:
type:script_output
message:restarting MosDNS, pf-aliasd and controller services

[status]
command:/usr/local/sbin/mosdns-control status
parameters:
type:script_output
message:checking MosDNS, pf-aliasd and controller status

# --- 子服务独立控制: MosDNS 核心转发引擎 ---
[dns.start]
command:/usr/local/etc/rc.d/mosdns onestart
parameters:
type:script_output
message:starting MosDNS daemon

[dns.stop]
command:/usr/local/etc/rc.d/mosdns onestop
parameters:
type:script_output
message:stopping MosDNS daemon

[dns.restart]
command:/usr/local/etc/rc.d/mosdns onerestart
parameters:
type:script_output
message:restarting MosDNS daemon

[dns.status]
command:/usr/local/etc/rc.d/mosdns onestatus
parameters:
type:script_output
message:checking MosDNS status

# --- 子服务独立控制: pf-aliasd (零首包竞态 PF 表守护进程) ---
[pf_aliasd.start]
command:/usr/local/etc/rc.d/pf_aliasd onestart
parameters:
type:script_output
message:starting pf-aliasd daemon

[pf_aliasd.stop]
command:/usr/local/etc/rc.d/pf_aliasd onestop
parameters:
type:script_output
message:stopping pf-aliasd daemon

[pf_aliasd.restart]
command:/usr/local/etc/rc.d/pf_aliasd onerestart
parameters:
type:script_output
message:restarting pf-aliasd daemon

[pf_aliasd.status]
command:/usr/local/etc/rc.d/pf_aliasd onestatus
parameters:
type:script_output
message:checking pf-aliasd status

# --- 子服务独立控制: mosdns-controller (独立的 WebUI 控制台 :5380) ---
[controller.start]
command:/usr/local/etc/rc.d/mosdns_controller onestart
parameters:
type:script_output
message:starting MosDNS Controller WebUI

[controller.stop]
command:/usr/local/etc/rc.d/mosdns_controller onestop
parameters:
type:script_output
message:stopping MosDNS Controller WebUI

[controller.restart]
command:/usr/local/etc/rc.d/mosdns_controller onerestart
parameters:
type:script_output
message:restarting MosDNS Controller WebUI

[controller.status]
command:/usr/local/etc/rc.d/mosdns_controller onestatus
parameters:
type:script_output
message:checking MosDNS Controller status

# --- 单独规则库同步 ---
[rules.update]
command:/usr/local/sbin/update-opnbox-rules.sh
parameters:
type:script_output
message:updating MosDNS routing rules

[rules.update_mirror]
command:/usr/local/sbin/update-opnbox-rules.sh --mirror
parameters:
type:script_output
message:updating MosDNS routing rules via mirror
