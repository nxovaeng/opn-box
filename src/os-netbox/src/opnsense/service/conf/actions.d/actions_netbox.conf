# ==============================================================================
# actions_netbox.conf - NetBox 策略路由与分流套件全局动作定义
# 作用域: configctl netbox <action>
# 职责边界: 全套件一键启停联动、健康巡检、规则库全量更新 (MosDNS + Xray)
# ==============================================================================

# --- 全套件一键启停联动 (调用统一控制脚本) ---
[start]
command:/usr/local/sbin/opnbox-control start all
parameters:
type:script_output
message:starting all NetBox suite services

[stop]
command:/usr/local/sbin/opnbox-control stop all
parameters:
type:script_output
message:stopping all NetBox suite services

[restart]
command:/usr/local/sbin/opnbox-control restart all
parameters:
type:script_output
message:restarting all NetBox suite services

[status]
command:/usr/local/sbin/opnbox-control status all
parameters:
type:script_output
message:checking all NetBox suite status

# --- 全量规则库同步与更新 (MosDNS + Xray) ---
[update_rules]
command:/usr/local/sbin/update-opnbox-rules.sh --mirror
parameters:
type:script_output
message:updating MosDNS and Xray rule databases

[rules]
command:/usr/local/sbin/update-opnbox-rules.sh --mirror
parameters:
type:script_output
message:updating MosDNS and Xray rule databases

[rules_update]
command:/usr/local/sbin/update-opnbox-rules.sh --mirror
parameters:
type:script_output
message:updating MosDNS and Xray rule databases

[rules.update]
command:/usr/local/sbin/update-opnbox-rules.sh --mirror
parameters:
type:script_output
message:updating MosDNS and Xray rule databases

[rules.update_mirror]
command:/usr/local/sbin/update-opnbox-rules.sh --mirror
parameters:
type:script_output
message:updating MosDNS and Xray rule databases via acceleration mirror
