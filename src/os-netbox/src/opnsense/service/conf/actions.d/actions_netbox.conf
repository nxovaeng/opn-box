# ==============================================================================
# actions_netbox.conf - NetBox 策略路由与分流套件全局动作定义
# 作用域: configctl netbox <action>
# 职责边界: 全套件一键启停联动、健康巡检、规则库全量更新 (MosDNS + Xray)
# ==============================================================================

# --- 全套件一键启停 ---
[start]
command:/usr/local/etc/rc.d/pf_aliasd start && /usr/local/etc/rc.d/mosdns start && /usr/local/etc/rc.d/mosdns_controller start && /usr/local/etc/rc.d/hev_socks5_tunnel start && /usr/local/etc/rc.d/hev_controller start && /usr/local/etc/rc.d/xray start && /usr/local/etc/rc.d/xray_controller start
parameters:
type:script
message:starting all NetBox suite services

[stop]
command:/usr/local/etc/rc.d/xray_controller stop ; /usr/local/etc/rc.d/xray stop ; /usr/local/etc/rc.d/hev_controller stop ; /usr/local/etc/rc.d/hev_socks5_tunnel stop ; /usr/local/etc/rc.d/mosdns_controller stop ; /usr/local/etc/rc.d/mosdns stop ; /usr/local/etc/rc.d/pf_aliasd stop
parameters:
type:script
message:stopping all NetBox suite services

[restart]
command:/usr/local/etc/rc.d/xray_controller restart ; /usr/local/etc/rc.d/xray restart ; /usr/local/etc/rc.d/hev_controller restart ; /usr/local/etc/rc.d/hev_socks5_tunnel restart ; /usr/local/etc/rc.d/mosdns_controller restart ; /usr/local/etc/rc.d/mosdns restart ; /usr/local/etc/rc.d/pf_aliasd restart
parameters:
type:script
message:restarting all NetBox suite services

[status]
command:/usr/local/etc/rc.d/pf_aliasd status && /usr/local/etc/rc.d/mosdns status && /usr/local/etc/rc.d/mosdns_controller status && /usr/local/etc/rc.d/hev_socks5_tunnel status && /usr/local/etc/rc.d/hev_controller status && /usr/local/etc/rc.d/xray status && /usr/local/etc/rc.d/xray_controller status
parameters:
type:script_output
message:checking all NetBox suite status

# --- 全量规则库同步与更新 (MosDNS + Xray) ---
[rules.update]
command:/usr/local/sbin/update-opnbox-rules.sh
parameters:
type:script_output
message:updating MosDNS and Xray rule databases

[rules.update_mirror]
command:/usr/local/sbin/update-opnbox-rules.sh --mirror
parameters:
type:script_output
message:updating MosDNS and Xray rule databases via acceleration mirror
