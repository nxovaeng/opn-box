# ==============================================================================
# actions_netbox.conf - NetBox 策略路由与分流套件全局动作定义
# 作用域: configctl netbox <action>
# 职责边界: 全套件一键启停联动、健康巡检、规则库全量更新 (MosDNS + Xray)
# ==============================================================================

# --- 全套件一键启停 ---
[start]
command:/usr/local/etc/rc.d/pf_aliasd onestart 2>&1 || true ; /usr/local/etc/rc.d/mosdns onestart 2>&1 || true ; /usr/local/etc/rc.d/mosdns_controller onestart 2>&1 || true ; /usr/local/etc/rc.d/hev_socks5_tunnel onestart 2>&1 || true ; /usr/local/etc/rc.d/hev_controller onestart 2>&1 || true ; /usr/local/etc/rc.d/xray onestart 2>&1 || true ; /usr/local/etc/rc.d/xray_controller onestart 2>&1 || true
parameters:
type:script
message:starting all NetBox suite services

[stop]
command:/usr/local/etc/rc.d/xray_controller onestop 2>&1 || true ; /usr/local/etc/rc.d/xray onestop 2>&1 || true ; /usr/local/etc/rc.d/hev_controller onestop 2>&1 || true ; /usr/local/etc/rc.d/hev_socks5_tunnel onestop 2>&1 || true ; /usr/local/etc/rc.d/mosdns_controller onestop 2>&1 || true ; /usr/local/etc/rc.d/mosdns onestop 2>&1 || true ; /usr/local/etc/rc.d/pf_aliasd onestop 2>&1 || true
parameters:
type:script
message:stopping all NetBox suite services

[restart]
command:/usr/local/etc/rc.d/xray_controller onerestart 2>&1 || true ; /usr/local/etc/rc.d/xray onerestart 2>&1 || true ; /usr/local/etc/rc.d/hev_controller onerestart 2>&1 || true ; /usr/local/etc/rc.d/hev_socks5_tunnel onerestart 2>&1 || true ; /usr/local/etc/rc.d/mosdns_controller onerestart 2>&1 || true ; /usr/local/etc/rc.d/mosdns onerestart 2>&1 || true ; /usr/local/etc/rc.d/pf_aliasd onerestart 2>&1 || true
parameters:
type:script
message:restarting all NetBox suite services

[status]
command:/usr/local/etc/rc.d/pf_aliasd onestatus 2>&1 || true ; /usr/local/etc/rc.d/mosdns onestatus 2>&1 || true ; /usr/local/etc/rc.d/mosdns_controller onestatus 2>&1 || true ; /usr/local/etc/rc.d/hev_socks5_tunnel onestatus 2>&1 || true ; /usr/local/etc/rc.d/hev_controller onestatus 2>&1 || true ; /usr/local/etc/rc.d/xray onestatus 2>&1 || true ; /usr/local/etc/rc.d/xray_controller onestatus 2>&1 || true
parameters:
type:script_output
message:checking all NetBox suite status

# --- 全量规则库同步与更新 (MosDNS + Xray) ---
[rules.update]
command:/usr/local/sbin/update-opnbox-rules.sh
parameters:
type:script_output
message:updating MosDNS and Xray rule databases

[rules.update_mirror]
command:/usr/local/sbin/update-opnbox-rules.sh --mirror
parameters:
type:script_output
message:updating MosDNS and Xray rule databases via acceleration mirror
