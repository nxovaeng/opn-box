name: Build OPNsense 26.x Package Repository

on:
  workflow_dispatch:
    inputs:
      build_singbox:
        description: 'Build sing-box with FreeBSD TUN patches'
        required: false
        type: boolean
        default: true
      build_mosdns_x:
        description: 'Build mosdns-x (DoQ/DoH3) [Optional]'
        required: false
        type: boolean
        default: false
      hev_version:
        description: 'hev-socks5-tunnel stable version'
        required: false
        type: string
        default: '2.17.1'
      xray_version:
        description: 'xray-core stable version'
        required: false
        type: string
        default: '26.7.11'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  CUSTOM_DOMAIN: opnbox.zro.qzz.io
  HEV_TUNNEL_VERSION: ${{ github.event.inputs.hev_version || '2.17.1' }}
  XRAY_VERSION: ${{ github.event.inputs.xray_version || '26.7.11' }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout opn-box Source
        uses: actions/checkout@v4

      - name: Setup Go Compiler
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Setup Node.js (for WebUI embedding)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Step 1: 100% 源码自编译 (绝不使用第三方预编译二进制)
      - name: Build All FreeBSD Binaries from Source
        env:
          BUILD_SINGBOX: ${{ github.event.inputs.build_singbox != false && github.event.inputs.build_singbox != 'false' && '1' || '0' }}
          BUILD_MOSDNS_X: ${{ github.event.inputs.build_mosdns_x == true && '1' || '0' }}
        run: |
          chmod +x scripts/build_binaries.sh
          ./scripts/build_binaries.sh dist/bin

      # Step 2: Native FreeBSD Packaging and Repository Generation
      - name: Package & Create Repo in FreeBSD 15 VM
        uses: vmactions/freebsd-vm@v1
        with:
          release: "15.0"
          usesh: true
          prepare: |
            pkg install -y pkg git gmake
          run: |
            chmod +x scripts/package_repo.sh
            ./scripts/package_repo.sh \
              --dist-dir dist \
              --output-dir repo_output \
              --publish-dir "$GITHUB_WORKSPACE/public" \
              --repo-owner "${{ github.repository_owner }}" \
              --repo-name "${{ github.event.repository.name }}" \
              --domain "${{ env.CUSTOM_DOMAIN }}" \
              --hev-version "${{ env.HEV_TUNNEL_VERSION }}" \
              --xray-version "${{ env.XRAY_VERSION }}"

      # Step 3: Generate Repository Portal & MkDocs Documentation Site
      - name: Setup Python for MkDocs
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install MkDocs Material
        run: |
          pip install --no-cache-dir mkdocs-material

      - name: Generate Repository Portal & Documentation Site
        run: |
          chmod +x scripts/generate_index.sh
          ./scripts/generate_index.sh public "${{ github.repository_owner }}" "${{ github.event.repository.name }}" "${{ env.CUSTOM_DOMAIN }}"

      # Step 4: Deploy to GitHub Pages
      - name: Deploy to GitHub Pages Branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          cname: ${{ env.CUSTOM_DOMAIN }}
          force_orphan: true

