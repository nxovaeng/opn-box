# ==============================================================================
# MosDNS v5 Configuration - OPN-Box 粗粒度智能分流与零竞态 PF 同步
# 适配官方版本: MosDNS v5.3.4 (现代流水线语法，完全杜绝 v4 解码崩溃)
#
# 分流逻辑：
# 1. 明确国内域名与白名单 (cn.txt / custom-direct.txt) -> 国内 DNS 直连解析并返回 (不入代理表)
# 2. 明确出海域名 (gfw.txt / custom-proxy.txt) 以及 未明确分类的境外/未知域名 ->
#    全部走海外防污染 DoH (经 Xray 127.0.0.1:10853) 并注入 PF Table <GFW_Proxy> 送往 TUN 网卡
# 3. 后端 Xray-core 利用 7 层 SNI 嗅探与 geosite.dat 进行二次精细分流 (OpenAI/流媒体等)
# ==============================================================================

log:
  level: info
  file: ""

plugins:
  # -------------------------------------------------------------
  # 1. Upstream Forwarders (上下游 DNS 解析器)
  # -------------------------------------------------------------
  - tag: forward_remote
    type: forward
    args:
      concurrent: 2
      upstreams:
        # ----------------------------------------------------------------------
        # 方案一 (Xray 本地 DNS 服务直连，强烈推荐):
        # 直接接入 Xray 的 dns-in 入站 (dokodemo-door: 127.0.0.1:10853)。
        # 运行原理:
        # 1. 走本地回环通信 (lo0)，完全不经过 TUN 虚拟网卡，天然杜绝死锁与漏流；
        # 2. Xray 收到后，由路由规则导向出站，并使用当前激活的代理节点出海解析；
        # 3. 注意: 此处为直连本机回环端口，无需也不应在此配置 socks5 代理。
        # ----------------------------------------------------------------------
        - addr: "127.0.0.1:10853"

  - tag: forward_local
    type: forward
    args:
      concurrent: 2
      upstreams:
        - addr: "223.5.5.5:53"
        - addr: "119.29.29.29:53"

  # -------------------------------------------------------------
  # 2. Domain Data Providers (域名 Set 规则集合)
  # -------------------------------------------------------------
  # 国内直连域名集合 (权威大库 + 用户自定义白名单)
  - tag: direct_domain_set
    type: domain_set
    args:
      files:
        - "/usr/local/etc/mosdns/rule/cn.txt"
        - "/usr/local/etc/mosdns/rule/custom-direct.txt"

  # 出海代理域名集合 (防污染名单 + 用户自定义黑名单)
  - tag: proxy_domain_set
    type: domain_set
    args:
      files:
        - "/usr/local/etc/mosdns/rule/gfw.txt"
        - "/usr/local/etc/mosdns/rule/custom-proxy.txt"

  # -------------------------------------------------------------
  # 3. pf_alias Plugin (OPNsense External Alias 动态同步插件)
  # -------------------------------------------------------------
  - tag: sync_to_pf
    type: pf_alias
    args:
      socket_path: "/var/run/pf-aliasd.sock"
      table: "GFW_Proxy"          # OPNsense External Alias 表名 (table <GFW_Proxy> persist)
      min_ttl: 60                 # 最小 TTL 钳位 (秒)
      max_ttl: 86400              # 最大 TTL 钳位 (24小时)
      timeout: "100ms"            # 同步等待超时 (防挂起保护)
      sync: true                  # 同步阻塞注入 (消除首包失步竞态)

  # -------------------------------------------------------------
  # 4. Main Sequence Pipeline (主匹配流水线 - MosDNS v5 标准语法)
  # -------------------------------------------------------------
  - tag: main_sequence
    type: sequence
    args:
      # [步骤 1] 明确不走代理的国内域名：走国内 DNS 解析，若已获取解析结果则直接返回 (不进 PF 代理表)
      - matches:
          - qname $direct_domain_set
        exec: $forward_local
      - matches:
          - has_resp
        exec: return

      # [步骤 2] 未匹配直连的境外或未知域名：
      #         统一走海外防污染 DoH 解析，并同步将 IP 注入 PF Table <GFW_Proxy> 进入 TUN 网卡
      - exec: $forward_remote
      - exec: $sync_to_pf

  # -------------------------------------------------------------
  # 5. DNS Server Listeners (本地监听)
  # -------------------------------------------------------------
  - tag: udp_server
    type: udp_server
    args:
      entry: main_sequence
      listen: "127.0.0.1:5353"

  - tag: tcp_server
    type: tcp_server
    args:
      entry: main_sequence
      listen: "127.0.0.1:5353"
